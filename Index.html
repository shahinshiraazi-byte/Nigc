<style>
  :root{ --bg:#0b0f14; --panel:#121821; --line:#253040; --ink:#e8edf3; --ink-dim:#90a0b3; --steel:#6f9bd6; --amber:#e0a940; }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; height:100%;}
  body{background:var(--bg); color:var(--ink); font-family:'Vazirmatn',sans-serif;}
  .shell{display:flex; flex-direction:column; height:100vh;}
  .shell-header{padding:14px 18px 10px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#10161f,#0b0f14); flex-shrink:0;}
  .shell-header .designer{font-size:1.15rem; font-weight:800; color:var(--steel); margin-bottom:6px;}
  .shell-header h1{font-size:1.05rem; font-weight:900; margin:0 0 10px;}
  .tabbar{display:flex; gap:8px;}
  .tabbtn{flex:1; background:#161f2c; border:1.5px solid var(--line); color:var(--ink-dim); padding:11px 10px;
    border-radius:10px; cursor:pointer; font-family:inherit; font-size:.85rem; font-weight:700; text-align:center; transition:all .15s;}
  .tabbtn.active{border-color:var(--amber); background:linear-gradient(180deg,#3a2d10,#161f2c); color:#f0d9a3;}
  .frame-area{flex:1; position:relative; overflow:hidden;}
  iframe{position:absolute; inset:0; width:100%; height:100%; border:none; display:none; background:var(--bg);}
  iframe.active{display:block;}
  .loading{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:.85rem;}
</style>
</head>

function b64ToText(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++){ bytes[i] = bin.charCodeAt(i); }
  return new TextDecoder('utf-8').decode(bytes);
}

let loadedIgs = false, loadedPv = false, loadedValve = false;

function loadFrame(id, b64){
  const frame = document.getElementById(id);
  frame.srcdoc = b64ToText(b64);
}

function switchApp(which){
  document.getElementById('tab-igs').classList.toggle('active', which==='igs');
  document.getElementById('tab-pv').classList.toggle('active', which==='pv');
  document.getElementById('tab-valve').classList.toggle('active', which==='valve');
  document.getElementById('frame-igs').classList.toggle('active', which==='igs');
  document.getElementById('frame-pv').classList.toggle('active', which==='pv');
  document.getElementById('frame-valve').classList.toggle('active', which==='valve');

  if(which==='igs' && !loadedIgs){ loadFrame('frame-igs', IGS_B64); loadedIgs = true; }
  if(which==='pv' && !loadedPv){ loadFrame('frame-pv', PV_B64); loadedPv = true; }
  if(which==='valve' && !loadedValve){ loadFrame('frame-valve', VALVE_B64); loadedValve = true; }
  document.getElementById('loadingMsg').style.display = 'none';
}

// initial load
loadFrame('frame-igs', IGS_B64);
loadedIgs = true;
document.getElementById('loadingMsg').style.display = 'none';
</script>
