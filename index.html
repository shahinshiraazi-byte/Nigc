<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ابزارهای مهندسی خط لوله گاز | مهندس شاهین شیرازی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0b0f14; --panel:#121821; --line:#253040; --ink:#e8edf3; --ink-dim:#90a0b3; --steel:#6f9bd6; --amber:#e0a940; }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; height:100%;}
  body{background:var(--bg); color:var(--ink); font-family:'Vazirmatn',sans-serif;}
  .shell{display:flex; flex-direction:column; height:100vh;}

  .home-screen{flex:1; overflow-y:auto; padding:24px 18px 34px;}
  .home-header{margin-bottom:24px;}
  .home-header .designer{font-size:.9rem; font-weight:800; color:var(--steel); margin:0;}
  .home-header h1{font-size:1.1rem; font-weight:900; margin:0 0 6px;}
  .app-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px;}
  .app-icon{display:flex; flex-direction:column; align-items:center; gap:10px; background:none; border:none; padding:0; cursor:pointer; font-family:inherit; color:var(--ink);}
  .icon-box{width:100%; aspect-ratio:1/1; border-radius:24px; display:flex; align-items:center; justify-content:center; font-size:2.1rem;
    box-shadow:0 8px 18px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1); transition:transform .12s;}
  .app-icon:active .icon-box{transform:scale(.93);}
  .icon-label{font-size:.82rem; font-weight:700; text-align:center; line-height:1.4; color:var(--ink);}
  .icon-igs{background:linear-gradient(150deg,#e0a940,#8a5c14);}
  .icon-pv{background:linear-gradient(150deg,#6f9bd6,#2f4d70);}
  .icon-valve{background:linear-gradient(150deg,#e0654f,#7d2f22);}
  .icon-qc{background:linear-gradient(150deg,#4fbf8f,#1f6e4d);}
  .icon-box svg{width:56%; height:56%; overflow:visible; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}

  .app-screen{flex:1; display:flex; flex-direction:column; overflow:hidden;}
  .app-topbar{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#10161f,#0b0f14); flex-shrink:0;}
  .back-btn{background:#161f2c; border:1.5px solid var(--line); color:var(--ink); width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; font-size:1.05rem; font-family:inherit;}
  .back-btn:active{background:#1c2634;}
  .app-title{font-size:.95rem; font-weight:800;}
  .frame-area{flex:1; position:relative; overflow:hidden;}
  iframe{position:absolute; inset:0; width:100%; height:100%; border:none; display:none; background:var(--bg);}
  iframe.active{display:block;}
  .loading{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:.85rem; background:var(--bg);}
</style>
</head>

</div>

function b64ToText(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++){ bytes[i] = bin.charCodeAt(i); }
  return new TextDecoder('utf-8').decode(bytes);
}

function loadFrame(id, b64){
  const frame = document.getElementById(id);
  frame.srcdoc = b64ToText(b64);
}

const APP_TITLES = {
  igs: 'آزمایش مقاومت و نشتی',
  pv: 'مشخصات لوله و شیر',
  valve: 'بازرسی ولو',
  qc: 'کنتور توربینی و VCD'
};
const APP_B64 = { igs: IGS_B64, pv: PV_B64, valve: VALVE_B64, qc: QC_B64 };
const APP_LOADED = { igs: false, pv: false, valve: false, qc: false };

function openApp(which){
  document.getElementById('homeScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
  document.getElementById('appTitle').textContent = APP_TITLES[which];
  document.getElementById('frame-igs').classList.toggle('active', which==='igs');
  document.getElementById('frame-pv').classList.toggle('active', which==='pv');
  document.getElementById('frame-valve').classList.toggle('active', which==='valve');
  document.getElementById('frame-qc').classList.toggle('active', which==='qc');

  if(!APP_LOADED[which]){
    document.getElementById('loadingMsg').style.display = 'flex';
    setTimeout(function(){
      loadFrame('frame-' + which, APP_B64[which]);
      APP_LOADED[which] = true;
      document.getElementById('loadingMsg').style.display = 'none';
    }, 10);
  } else {
    document.getElementById('loadingMsg').style.display = 'none';
  }
}

function closeApp(){
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('homeScreen').style.display = 'block';
}
</script>
